[project]
name = "conbarai"
version = "1.5.2"
description = "Panel flotante estilo Omarchy con OpenCode para Ubuntu GNOME"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ConBarAI contributors" }]
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["icons", "autostart"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "SIM", # simplificación
    "PL",  # pylint
    "RUF", # ruff específico
]
ignore = [
    "PLR0912", # complejidad de ramas: aceptable en handlers GTK
    "PLR0915", # longitud de función: aceptable en handlers GTK
    "PLR2004", # constantes mágicas de geometría/umbrales
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
