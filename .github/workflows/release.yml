name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer notas del changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {en=1; next}
            en && /^## \[/ {exit}
            en {print}
          ' CHANGELOG.md > notas.md
          if ! [ -s notas.md ]; then
            echo "Version $VER" > notas.md
          fi
          echo "--- notas ---" && cat notas.md
      - name: Dependencias del sistema (las mismas que exige install.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo \
            gir1.2-vte-2.91 gir1.2-ayatanaappindicator3-0.1 wmctrl xdotool tmux libnotify-bin
          /usr/bin/python3 -c "import cairo, gi, gi._gi_cairo"
      - name: Construir AppImage
        run: bash scripts/build-appimage.sh dist
      - name: Probar la AppImage (instalar sin lanzar)
        run: |
          FAKE=$(mktemp -d)
          HOME="$FAKE" CONBARAI_INSTALL_ONLY=1 ./dist/ConBarAI-x86_64.AppImage --appimage-extract-and-run
          test -x "$FAKE/.local/bin/conbarai"
          test -f "$FAKE/.local/share/conbarai/app/oc-drop"
          echo "instalacion desde AppImage verificada"
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/ConBarAI-x86_64.AppImage install.sh
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ConBarAI $GITHUB_REF_NAME" \
              --notes-file notas.md \
              dist/ConBarAI-x86_64.AppImage install.sh
          fi
