name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer notas del changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {en=1; next}
            en && /^## \[/ {exit}
            en {print}
          ' CHANGELOG.md > notas.md
          if ! [ -s notas.md ]; then
            echo "Version $VER" > notas.md
          fi
          echo "--- notas ---" && cat notas.md
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ConBarAI $GITHUB_REF_NAME" \
            --notes-file notas.md
