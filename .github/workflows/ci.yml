name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install "ruff==0.16.5" pytest
      - name: Analisis estatico
        run: ruff check .
      - name: Tests unitarios
        run: python -m pytest -q
